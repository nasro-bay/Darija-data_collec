# List of YouTube channels to scrape, newest videos first.
#
# Each entry needs either:
#   - handle: the @handle shown on the channel page (e.g. "@somechannel"), or
#   - channel_id: the raw channel ID (starts with "UC...")
#
# Optional `max_videos` caps how many of the channel's NEWEST videos get
# scraped (useful to bound quota spend on channels with huge back
# catalogs). Omit it to eventually walk the whole channel, safely spread
# across as many resumed runs as needed.
#
# Use `python scripts/discover_channels.py` to search for candidate
# channels, then paste the ones that fit here.

channels:
# Example (replace with real channels):
# channels:
#   - handle: "@example_channel"
#     max_videos: 20
#   - channel_id: "UCxxxxxxxxxxxxxxxxxxxxxx"

